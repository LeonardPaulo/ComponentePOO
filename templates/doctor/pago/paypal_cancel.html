{% extends 'home.html' %}
{% block title %}Pago Cancelado{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    .cancel-container {
        max-width: 500px;
        margin: 4rem auto 0 auto;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.10);
        padding: 2.5rem 2rem 2rem 2rem;
        text-align: center;
    }
    .cancel-icon {
        font-size: 3.5rem;
        color: #ef4444;
        margin-bottom: 1.2rem;
        background: #fee2e2;
        border-radius: 50%;
        padding: 1.2rem;
        display: inline-block;
    }
    .cancel-title {
        font-size: 2rem;
        font-weight: 700;
        color: #ef4444;
        margin-bottom: 1rem;
    }
    .cancel-text {
        font-size: 1.1rem;
        color: #374151;
        margin-bottom: 2rem;
    }
    .btn-cancel-back {
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: #fff;
        padding: 0.9rem 2.2rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        transition: all 0.2s;
        cursor: pointer;
        text-decoration: none;
    }
    .btn-cancel-back:hover {
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        transform: translateY(-1px);
    }
</style>

<div class="cancel-container">
    <span class="cancel-icon">
        <i class="fa-solid fa-circle-xmark"></i>
    </span>
    <div class="cancel-title">Pago cancelado</div>
    <div class="cancel-text">
        El pago fue cancelado por el usuario.<br>
        Si deseas, puedes intentarlo nuevamente o regresar al listado de pagos.
    </div>
    <a href="{% url 'doctor:pago_list' %}" class="btn-cancel-back">
        <i class="fas fa-arrow-left"></i> Volver a Pagos
    </a>
</div>
{% endblock %}
