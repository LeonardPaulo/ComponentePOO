{% extends 'home.html' %}
{% load static %}

{% block title %}Pago Exitoso{% endblock %}

{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    .success-container {
        max-width: 600px;
        margin: 3rem auto;
        padding: 2rem;
        text-align: center;
    }
    .success-card {
        background: white;
        border-radius: 15px;
        padding: 3rem 2rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        border: 2px solid #10b981;
    }
    .success-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #10b981, #059669);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        color: white;
        font-size: 3.5rem;
    }
    .success-title {
        font-size: 2rem;
        font-weight: 700;
        color: #10b981;
        margin-bottom: 1rem;
    }
    .success-message, .success-text {
        font-size: 1.1rem;
        color: #374151;
        margin-bottom: 2rem;
        line-height: 1.6;
    }
    .btn-success-back {
        background: linear-gradient(135deg, #10b981, #059669);
        color: #fff;
        padding: 0.9rem 2.2rem;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        transition: all 0.2s;
        cursor: pointer;
        text-decoration: none;
        margin-top: 1.5rem;
    }
    .btn-success-back:hover {
        background: linear-gradient(135deg, #059669, #047857);
        color: #fff;
        transform: translateY(-1px);
    }
    @media (max-width: 768px) {
        .success-container {
            margin: 1rem;
            padding: 1rem;
        }
        .success-card {
            padding: 2rem 1.5rem;
        }
        .success-title {
            font-size: 1.5rem;
        }
        .btn-success-back {
            width: 100%;
            max-width: 250px;
            justify-content: center;
        }
    }
</style>

<div class="success-container">
    <div class="success-card">
        <div class="success-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="success-title">¡Pago realizado con éxito!</div>
        <div class="success-text">
            El pago #{{ pago.id }} fue procesado correctamente.<br>
            Gracias por tu confianza.
        </div>
        <a href="{% url 'doctor:pago_list' %}" class="btn-success-back">
            <i class="fas fa-arrow-left"></i> Volver a Pagos
        </a>
    </div>
</div>
{% endblock %}
